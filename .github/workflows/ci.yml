name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --group dev
      - run: uv run --no-sync ruff check src tests examples benchmarks
      - run: uv run --no-sync ty check src
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync python -m benchmarks.report --verify
      - run: uv run --no-sync python -m benchmarks.quality
      - run: uv run --no-sync python -m benchmarks.end_to_end_report --verify
      - run: uv run --no-sync python -m benchmarks.warm_cache_report
      - run: uv build
